name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile (python:3.14-slim). Not yet verified on 3.14 in CI; fall back to 3.13 if wheels fail.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: trading_brain/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: trading_brain
      - run: python -m pytest -q
        working-directory: trading_brain
