# Single-host deployment: `docker compose up -d --build`.
#
# Services:
#   caddy  - public HTTPS on 80/443 for DOMAIN; serves the dashboard and proxies /api
#   api    - the read API and Telegram webhook, internal only
#   poll   - the market scan loop (every POLLING_INTERVAL_MINUTES, default 5)
#
# Secrets come from .env, which must be readable only by its owner: chmod 600 .env
# Both app services share one SQLite file in ./data.
x-app: &app
  build: .
  env_file: .env
  environment:
    STORAGE_BACKEND: sqlite
    SQLITE_PATH: /data/trading_brain.db
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]

  poll:
    <<: *app
    command: ["python", "scripts/run_poll.py"]

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend-dist:/srv/dashboard:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
